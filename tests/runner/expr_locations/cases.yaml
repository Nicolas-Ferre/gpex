# Test expressions in all possible locations.

dimensions:
  - id: expr_location
    cases:
      value_global:
        code: |
          {{result.item_type}} output = {{expr.form}};
          var _result = output; // expected: {{expr.value}}
      statement_assignment_left:
        code: |
          {{result.item_type}} output = called_fn({{expr.type_default}});
          fn called_fn(param: {{expr.type}}) -> {{expr.type}} {
              {{expr.form}} = {{expr.value}};
              return {{expr.form}};
          }
          var _result = output; // expected: {{expr.value}}
      statement_assignment_right:
        code: |
          var result = {{expr.type_default}}; // expected: {{expr.value}}
          repeat called_fn({{expr.value}});
          fn called_fn(param: {{expr.type}}) {
              result = {{expr.form}};
          }
      statement_return:
        code: |
          {{result.item_type}} output = called_fn({{expr.value}});
          {{fn.qualifier}} fn called_fn(param: {{expr.type}}) -> {{expr.type}} {
              return {{expr.form}};
          }
          var _result = output; // expected: {{expr.value}}
      fn_param_type:
        code: |
          {{result.item_type}} output = called_fn(123);
          {{fn.qualifier}} fn called_fn(param: {{expr.form}}) -> i32 {
              return param;
          }
          var _result = output; // expected: 123
      fn_return_type:
        code: |
          {{result.item_type}} output = fn_(123);
          {{fn.qualifier}} fn fn_(param: i32) -> {{expr.form}} {
              return param;
          }
          var _result = output; // expected: 123

  - id: result
    cases:
      const:
        item_type: "const"
      var:
        item_type: "var"

  - id: fn
    cases:
      const:
        qualifier: "const"
      not_const:
        qualifier: ""

  - id: expr
    cases:
      literal:
        form: "123"
        value: "123"
        type: "i32"
        type_default: "0"
      type_native:
        form: "i32"
        value: "i32"
        type: "typeref"
        type_default: "bool"
      var_global:
        form: "var_"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "var var_ = i32;"
      const_global:
        form: "CONST"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "const CONST = i32;"
      fn_call_not_const_no_args:
        form: "fn_()"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "fn fn_() -> typeref { return i32; }"
      fn_call_const_no_args:
        form: "fn_()"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "const fn fn_() -> typeref { return i32; }"
      fn_call_not_const_args:
        form: "fn_(0, {{expr_arg.form}})"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "fn fn_(_param1: i32, param2: typeref) -> typeref { return param2; }"
      fn_call_const_args:
        form: "fn_(0, {{expr_arg.form}})"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "const fn fn_(_param1: i32, param2: typeref) -> typeref { return param2; }"
      fn_param:
        form: "param"
        value: "i32"
        type: "typeref"
        type_default: "bool"

  - id: expr_arg
    cases:
      literal:
        form: "i32"
      var_global:
        form: "param_var"
        source: "var param_var = i32;"
      const_global:
        form: "PARAM_CONST"
        source: "const PARAM_CONST = i32;"
      fn_call_not_const:
        form: "param_fn()"
        source: "fn param_fn() -> typeref { return i32; }"
      fn_call_const:
        form: "param_fn()"
        source: "const fn param_fn() -> typeref { return i32; }"
      fn_param:
        form: "param"

exclusions:
  - expr_location: [ fn_param_type, fn_return_type ]
    result: [ var ]

  - expr_location: [ value_global ]
    expr: [ fn_param ]

  - expr_location: [ statement_assignment_left ]
    expr:
      - literal
      - type_native
      - const_global
      - fn_call_not_const_no_args
      - fn_call_not_const_args
      - fn_call_const_no_args
      - fn_call_const_args
      - fn_param

  - expr_location: [ fn_param_type, fn_return_type ]
    expr: [ literal, fn_param ]

  - expr_location: [ value_global ]
    expr_arg: [ fn_param ]

  - result: [ const ]
    fn: [ not_const ]

  - result: [ const ]
    expr: [ var_global, fn_call_not_const_no_args, fn_call_not_const_args ]

  - result: [ const ]
    expr_arg: [ var_global, fn_call_not_const ]

  - fn: [ const ]
    expr: [ var_global, fn_call_not_const_no_args, fn_call_not_const_args ]

  - fn: [ const ]
    expr_arg: [ var_global, fn_call_not_const ]

  # Bug to fix (https://github.com/Nicolas-Ferre/gpex/issues/106)
  - expr_location: [ fn_param_type, fn_return_type ]
    expr: [ fn_call_const_args, fn_call_not_const_args, fn_call_const_no_args, fn_call_not_const_no_args ]
