# Test `const` optimizations at transpilation time.

dimensions:
  - id: expr_location
    cases:
      var_global:
        code: |
          var var_ = {{expr.form}};
          var _result = var_; // expected: {{expr.value}}
      const_global:
        code: |
          const RESULT = {{expr.form}};
          var _result = RESULT; // expected: {{expr.value}}
      statement_assignment_right:
        code: |
          var result = 0; // expected: {{expr.value}}
          repeat called_fn();
          fn called_fn() {
              result = {{expr.form}};
          }
      statement_return:
        code: |
          fn called_fn() -> i32 {
              return {{expr.form}};
          }
          var _result = called_fn(); // expected: {{expr.value}}
      fn_call_arg:
        code: |
          var _result = called_fn({{expr.form}}); // expected: {{expr.value}}
          const fn called_fn(param: i32) -> i32 {
              return param;
          }
      unary_operand_neg:
        code: |
          var _result = -{{expr.form}}; // expected: {{expr.value}}
          const fn __neg__(param: i32) -> i32 {
              return param;
          }
      unary_operand_not:
        code: |
          var _result = !{{expr.form}}; // expected: {{expr.value}}
          const fn __not__(param: i32) -> i32 {
              return param;
          }
      # repeat_fn_arg is not tested because it is irrelevant for this test.

  - id: expr
    cases:
      const_global:
        form: "CONST"
        source: "const CONST = 123;"
        value: "123"
      const_fn_without_param:
        form: "fn_()"
        source: "const fn fn_() -> i32 { return 123; }"
        value: "123"
      const_fn_with_param_and_statement_return:
        form: "fn_(123)"
        source: "const fn fn_(param: i32) -> i32 { return param; }"
        value: "123"
      const_fn_with_param_and_statement_assignment:
        form: "fn_(123)"
        source: "const fn fn_(param: i32) -> i32 { param = 123; return param; }"
        value: "123"
      const_unary_neg:
        form: "-123u"
        source: "const fn __neg__(_param: u32) -> i32 { return 123; }"
        value: "123"
      const_unary_not:
        form: "!123u"
        source: "const fn __not__(_param: u32) -> i32 { return 123; }"
        value: "123"
