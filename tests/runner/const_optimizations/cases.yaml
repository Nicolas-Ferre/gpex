# Test `const` optimizations at transpilation time.

dimensions:
  - id: expr_location
    cases:
      var_global:
        code: |
          var var_ = {{expr.form}};
          var _result = var_; // expected: {{source.expected}}
      const_global:
        code: |
          const RESULT = {{expr.form}};
          var _result = RESULT; // expected: {{source.expected}}
      statement_assignment_right:
        code: |
          var result = 0; // expected: {{source.expected}}
          repeat called_fn();
          fn called_fn() {
              result = {{expr.form}};
          }
      statement_return:
        code: |
          fn called_fn() -> i32 {
              return {{expr.form}};
          }
          var _result = called_fn(); // expected: {{source.expected}}
      repeat_fn_arg:
        code: |
          var result = 0; // expected: {{source.expected}}
          repeat called_fn({{expr.form}});
          fn called_fn(param: i32) {
              result = param;
          }

  - id: expr
    cases:
      const_global:
        form: "CONST"
        source: "const CONST = 123;"
      const_fn_without_param:
        form: "fn_()"
        source: "const fn fn_() -> i32 { return 123; }"
      const_fn_with_param_literal:
        form: "fn_(123)"
        source: ""
      const_fn_with_param_const:
        form: "fn_(CONST)"
        source: "const CONST = 123;"
      const_fn_with_param_fn_call:
        form: "fn_(fn_(123))"
        source: ""

  - id: source
    cases:
      none:
        code: ""
        expected: "123"
      statement_return:
        code: |
          const fn fn_(param: i32) -> i32 { 
              return param;
          }
        expected: "123"
      statement_assignment:
        code: |
          const fn fn_(param: i32) -> i32 { 
              param = 123;
              return param;
          }
        expected: "123"

exclusions:
  - expr: [ const_fn_with_param_literal, const_fn_with_param_const, const_fn_with_param_fn_call ]
    source: [ none ]

  - expr: [ const_global,const_fn_without_param ]
    source: [ statement_return, statement_assignment ]
