# Test expressions in all locations.

dimensions:
  - id: expr_location
    cases:
      value_global:
        code: |
          {{result.item_type}} output = {{expr.form}};
          var _result = output; // expected: {{expr.value}}
      statement_assignment_left:
        code: |
          {{result.item_type}} output = called_fn({{expr.type_default}});
          fn called_fn(param: {{expr.type}}) -> {{expr.type}} {
              {{expr.form}} = {{expr.type_default}};
              return {{expr.form}};
          }
          var _result = output; // expected: {{expr.type_default}}
      statement_assignment_right:
        code: |
          var result = {{expr.type_default}}; // expected: {{expr.value}}
          repeat called_fn({{expr.value}});
          fn called_fn(param: {{expr.type}}) {
              result = {{expr.form}};
          }
      statement_return:
        code: |
          {{result.item_type}} output = called_fn({{expr.value}});
          {{fn.qualifier}} fn called_fn(param: {{expr.type}}) -> {{expr.type}} {
              return {{expr.form}};
          }
          var _result = output; // expected: {{expr.value}}
      repeat_fn_arg:
        code: |
          var result = {{expr.type_default}}; // expected: {{expr.value}}
          repeat fn_({{expr.form}});
          fn fn_(param: {{expr.type}}) {
              result = param;
          }
      fn_param_type:
        code: |
          {{result.item_type}} output = called_fn(123);
          {{fn.qualifier}} fn called_fn(param: {{expr.form}}) -> i32 {
              return param;
          }
          var _result = output; // expected: 123
      fn_return_type:
        code: |
          {{result.item_type}} output = fn_(123);
          {{fn.qualifier}} fn fn_(param: i32) -> {{expr.form}} {
              return param;
          }
          var _result = output; // expected: 123

  - id: result
    cases:
      const:
        item_type: "const"
      var:
        item_type: "var"

  - id: fn
    cases:
      const:
        qualifier: "const"
      not_const:
        qualifier: ""

  - id: expr
    cases:
      literal_bool:
        form: "true"
        value: "true"
        type: "bool"
        type_default: "false"
        source: ""
      literal_f32:
        form: "1.23"
        value: "1.23"
        type: "f32"
        type_default: "0.0"
        source: ""
      literal_u32:
        form: "123u"
        value: "123u"
        type: "u32"
        type_default: "0u"
        source: ""
      literal_i32:
        form: "123"
        value: "123"
        type: "i32"
        type_default: "0"
        source: ""
      type_native:
        form: "i32"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: ""
      var_global:
        form: "var_"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "var var_ = i32;"
      const_global:
        form: "CONST"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "const CONST = i32;"
      fn_call_not_const_no_args:
        form: "fn_()"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "fn fn_() -> typeref { return i32; }"
      fn_call_const_no_args:
        form: "fn_()"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "const fn fn_() -> typeref { return i32; }"
      fn_call_not_const_args:
        form: "fn_(0, {{expr_arg.form}})"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "fn fn_(_param1: i32, param2: typeref) -> typeref { return param2; }"
      fn_call_const_args:
        form: "fn_(0, {{expr_arg.form}})"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "const fn fn_(_param1: i32, param2: typeref) -> typeref { return param2; }"
      fn_param:
        form: "param"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: ""

  - id: expr_arg
    cases:
      type_native:
        form: "i32"
        source: ""
      var_global:
        form: "param_var"
        source: "var param_var = i32;"
      const_global:
        form: "PARAM_CONST"
        source: "const PARAM_CONST = i32;"
      fn_call_not_const:
        form: "param_fn()"
        source: "fn param_fn() -> typeref { return i32; }"
      fn_call_const:
        form: "param_fn()"
        source: "const fn param_fn() -> typeref { return i32; }"
      fn_param:
        form: "param"
        source: ""

exclusions:
  - expr_location: [ fn_param_type, fn_return_type ]
    result: [ var ]

  - expr_location: [ statement_assignment_left ]
    result: [ const ]

  - expr_location: [ value_global, repeat_fn_arg ]
    expr: [ fn_param ]

  - expr_location: [ statement_assignment_left ]
    expr:
      - literal_bool
      - literal_f32
      - literal_i32
      - literal_u32
      - type_native
      - const_global
      - fn_call_not_const_no_args
      - fn_call_not_const_args
      - fn_call_const_no_args
      - fn_call_const_args

  - expr_location: [ fn_param_type, fn_return_type ]
    expr: [ literal_bool, literal_f32, literal_i32, literal_u32, fn_param ]

  - expr_location: [ value_global, repeat_fn_arg, fn_param_type, fn_return_type ]
    expr_arg: [ fn_param ]

  - result: [ const ]
    fn: [ not_const ]

  - result: [ const ]
    expr: [ var_global, fn_call_not_const_no_args, fn_call_not_const_args ]

  - result: [ const ]
    expr_arg: [ var_global, fn_call_not_const ]

  - fn: [ const ]
    expr: [ var_global, fn_call_not_const_no_args, fn_call_not_const_args ]

  - fn: [ const ]
    expr_arg: [ var_global, fn_call_not_const ]
