# Test expressions in all locations.

dimensions:
  - id: expr_location
    cases:
      const_global:
        exclusions: |
          {{expr.exclude_if_not_const}}
          {{expr.exclude_if_requires_fn_with_param}}
        code: |
          const RESULT = {{expr.form}};
          var _result = RESULT; // expected: {{expr.value}}
      var_global:
        exclusions: |
          {{expr.exclude_if_requires_fn_with_param}}
        code: |
          var _result = {{expr.form}}; // expected: {{expr.value}}
      statement_assignment_left:
        exclusions: |
          {{result.exclude_if_not_ref}}
          {{expr.exclude_if_not_ref}}
        code: |
          {{result.item_type}} output = called_fn({{expr.type_default}});
          {{fn.qualifier}} fn called_fn(param: {{expr.type}}) -> {{expr.type}} {
              {{expr.form}} = {{expr.type_default}};
              return {{expr.form}};
          }
          var _result = output; // expected: {{expr.type_default}}
      statement_assignment_right:
        exclusions: ""
        code: |
          var result = {{expr.type_default}}; // expected: {{expr.value}}
          repeat called_fn({{expr.value}});
          fn called_fn(param: {{expr.type}}) {
              result = {{expr.form}};
          }
      statement_return:
        exclusions: ""
        code: |
          {{result.item_type}} output = called_fn({{expr.value}});
          {{fn.qualifier}} fn called_fn(param: {{expr.type}}) -> {{expr.type}} {
              return {{expr.form}};
          }
          var _result = output; // expected: {{expr.value}}
      repeat_fn_arg:
        exclusions: |
          {{expr.exclude_if_requires_fn_with_param}}
        code: |
          var result = {{expr.type_default}}; // expected: {{expr.value}}
          repeat fn_({{expr.form}});
          fn fn_(param: {{expr.type}}) {
              result = param;
          }
      fn_call_arg:
        exclusions: ""
        code: |
          {{result.item_type}} result = called_fn({{expr.value}}); // expected: {{expr.value}}
          {{fn.qualifier}} fn called_fn(param: {{expr.type}}) -> {{expr.type}} {
              return called_fn_inner({{expr.form}});
          }
          {{fn.qualifier}} fn called_fn_inner(param: {{expr.type}}) -> {{expr.type}} {
              return param;
          }
      fn_param_type:
        exclusions: |
          {{result.exclude_if_not_const}}
          {{expr.exclude_if_not_typeref}}
          {{expr.exclude_if_requires_fn_with_param}}
        code: |
          {{result.item_type}} output = called_fn(123);
          {{fn.qualifier}} fn called_fn(param: {{expr.form}}) -> i32 {
              return param;
          }
          var _result = output; // expected: 123
      fn_return_type:
        exclusions: |
          {{result.exclude_if_not_const}}
          {{expr.exclude_if_not_typeref}}
          {{expr.exclude_if_requires_fn_with_param}}
        code: |
          {{result.item_type}} output = fn_(123);
          {{fn.qualifier}} fn fn_(param: i32) -> {{expr.form}} {
              return param;
          }
          var _result = output; // expected: 123

  - id: result
    cases:
      const:
        exclusions: |
          {{fn.exclude_if_not_const}}
          {{expr.exclude_if_not_const}}
        item_type: "const"
        exclude_if_not_const: ""
        exclude_if_not_ref: "<EXCLUDE>"
      var:
        exclusions: ""
        item_type: "var"
        exclude_if_not_const: "<EXCLUDE>"
        exclude_if_not_ref: ""

  - id: fn
    cases:
      const:
        exclusions: |
          {{expr.exclude_if_not_const}}
        qualifier: "const"
        exclude_if_not_const: ""
      not_const:
        exclusions: ""
        qualifier: ""
        exclude_if_not_const: "<EXCLUDE>"

  - id: expr
    cases:
      literal_bool:
        form: "true"
        value: "true"
        type: "bool"
        type_default: "false"
        source: ""
        exclude_if_not_const: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_typeref: "<EXCLUDE>"
        exclude_if_requires_fn_with_param: ""
      literal_f32:
        form: "1.23"
        value: "1.23"
        type: "f32"
        type_default: "0.0"
        source: ""
        exclude_if_not_const: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_typeref: "<EXCLUDE>"
        exclude_if_requires_fn_with_param: ""
      literal_u32:
        form: "123u"
        value: "123u"
        type: "u32"
        type_default: "0u"
        source: ""
        exclude_if_not_const: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_typeref: "<EXCLUDE>"
        exclude_if_requires_fn_with_param: ""
      literal_i32:
        form: "123"
        value: "123"
        type: "i32"
        type_default: "0"
        source: ""
        exclude_if_not_const: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_typeref: "<EXCLUDE>"
        exclude_if_requires_fn_with_param: ""
      type_native:
        form: "i32"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: ""
        exclude_if_not_const: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_typeref: ""
        exclude_if_requires_fn_with_param: ""
      var_global:
        form: "var_"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "var var_ = i32;"
        exclude_if_not_const: "<EXCLUDE>"
        exclude_if_not_ref: ""
        exclude_if_not_typeref: ""
        exclude_if_requires_fn_with_param: ""
      const_global:
        form: "CONST"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "const CONST = i32;"
        exclude_if_not_const: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_requires_fn_with_param: ""
        exclude_if_not_typeref: ""
      fn_call_not_const_no_args:
        form: "fn_()"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "fn fn_() -> typeref { return i32; }"
        exclude_if_not_const: "<EXCLUDE>"
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_typeref: ""
        exclude_if_requires_fn_with_param: ""
      fn_call_const_no_args:
        form: "fn_()"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "const fn fn_() -> typeref { return i32; }"
        exclude_if_not_const: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_typeref: ""
        exclude_if_requires_fn_with_param: ""
      fn_call_not_const_args:
        form: "fn_(0, i32)"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "fn fn_(_param1: i32, param2: typeref) -> typeref { return param2; }"
        exclude_if_not_const: "<EXCLUDE>"
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_typeref: ""
        exclude_if_requires_fn_with_param: ""
      fn_call_const_args:
        form: "fn_(0, i32)"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: "const fn fn_(_param1: i32, param2: typeref) -> typeref { return param2; }"
        exclude_if_not_const: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_typeref: ""
        exclude_if_requires_fn_with_param: ""
      fn_param:
        form: "param"
        value: "i32"
        type: "typeref"
        type_default: "bool"
        source: ""
        exclude_if_not_const: ""
        exclude_if_not_ref: ""
        exclude_if_not_typeref: ""
        exclude_if_requires_fn_with_param: "<EXCLUDE>"
