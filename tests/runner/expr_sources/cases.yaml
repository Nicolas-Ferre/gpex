# Test expressions with all source items placed at all locations.

dimensions:
  - id: source_location
    cases:
      after_expr:
        imported_indirect_code: ""
        imported_direct_code: ""
        exclusions: |
          {{expr.exclude_if_source_only_before_expr}}
        inline_code: |
          {{expr_location.code_before}}
          var _result = output; // expected: {{expr_location.expected}}
          {{expr_location.code_after}}
          {{expr.source}}
      before_expr:
        imported_indirect_code: ""
        imported_direct_code: ""
        exclusions: ""
        inline_code: |
          {{expr.source}}
          {{expr_location.code_before}}
          var _result = output; // expected: {{expr_location.expected}}
          {{expr_location.code_after}}
      imported_direct:
        imported_indirect_code: ""
        imported_direct_code: "{{expr.source}}"
        exclusions: ""
        inline_code: |
          {{expr_location.code_before}}
          var _result = output; // expected: {{expr_location.expected}}
          {{expr_location.code_after}}
      imported_indirect:
        imported_indirect_code: "{{expr.source}}"
        imported_direct_code: ""
        exclusions: ""
        inline_code: |
          {{expr_location.code_before}}
          var _result = output; // expected: {{expr_location.expected}}
          {{expr_location.code_after}}

  - id: expr_location
    cases:
      var_global:
        exclusions: |
          {{expr.exclude_if_requires_fn_with_param}}
        code_before: "var output = {{expr.form}};"
        code_after: ""
        expected: "{{global.expr_value}}"
      const_global:
        exclusions: |
          {{expr.exclude_if_not_const}}
          {{expr.exclude_if_requires_fn_with_param}}
        code_before: "const output = {{expr.form}};"
        code_after: ""
        expected: "{{global.expr_value}}"
      statement_assignment_left:
        exclusions: |
          {{expr.exclude_if_not_ref}}
        code_before: |
          var output = called_fn({{global.default_value}});
          fn called_fn(param: typeref) -> typeref {
              {{expr.form}} = {{global.default_value}};
              return {{expr.form}};
          }
        code_after: ""
        expected: "{{global.default_value}}"
      statement_assignment_right:
        exclusions: ""
        code_before: "var output = {{global.default_value}};"
        code_after: |
          repeat called_fn({{global.expr_value}});
          fn called_fn(param: typeref) {
              _result = {{expr.form}};
          }
        expected: "{{global.expr_value}}"
      statement_return:
        exclusions: ""
        code_before: |
          var output = called_fn({{global.expr_value}});
          fn called_fn(param: typeref) -> typeref {
              return {{expr.form}};
          }
        code_after: ""
        expected: "{{global.expr_value}}"
      repeat_fn_arg:
        exclusions: |
          {{expr.exclude_if_requires_fn_with_param}}
        code_before: "var output = {{global.default_value}};"
        code_after: |
          repeat called_fn({{expr.form}});
          fn called_fn(param: typeref) {
              _result = param;
          }
        expected: "{{global.expr_value}}"
      unary_operand_neg:
        exclusions: |
          {{expr.exclude_if_requires_fn_with_param}}
        code_before: |
          var output = -{{expr.form}}; // expected: {{global.expr_value}}
          const fn __neg__(param: typeref) -> typeref {
              return param;
          }
        code_after: ""
        expected: "{{global.expr_value}}"
      unary_operand_not:
        exclusions: |
          {{expr.exclude_if_requires_fn_with_param}}
        code_before: |
          var output = !{{expr.form}}; // expected: {{global.expr_value}}
          const fn __not__(param: typeref) -> typeref {
              return param;
          }
        code_after: ""
        expected: "{{global.expr_value}}"
      fn_param_type:
        exclusions: |
          {{expr.exclude_if_not_const}}
          {{expr.exclude_if_requires_fn_with_param}}
        code_before: |
          var output = called_fn({{global.value_from_expr_as_type}});
          fn called_fn(param: {{expr.form}}) -> {{global.expr_value}} {
              return param;
          }
        code_after: ""
        expected: "{{global.value_from_expr_as_type}}"
      fn_return_type:
        exclusions: |
          {{expr.exclude_if_not_const}}
          {{expr.exclude_if_requires_fn_with_param}}
        code_before: |
          var output = called_fn({{global.value_from_expr_as_type}});
          fn called_fn(param: {{global.expr_value}}) -> {{expr.form}} {
              return param;
          }
        code_after: ""
        expected: "{{global.value_from_expr_as_type}}"

  - id: expr
    cases:
      var_global:
        form: "var_"
        source: "pub var var_ = {{global.expr_value}};"
        exclude_if_source_only_before_expr: "<EXCLUDE>"
        exclude_if_not_ref: ""
        exclude_if_not_const: "<EXCLUDE>"
        exclude_if_requires_fn_with_param: ""
      const_global:
        form: "CONST"
        source: "pub const CONST = {{global.expr_value}};"
        exclude_if_source_only_before_expr: "<EXCLUDE>"
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_const: ""
        exclude_if_requires_fn_with_param: ""
      fn_call_no_args:
        form: "fn_()"
        source: "pub const fn fn_() -> typeref { return {{global.expr_value}}; }"
        exclude_if_source_only_before_expr: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_const: ""
        exclude_if_requires_fn_with_param: ""
      fn_call_args:
        form: "fn_(arg_fn())"
        source: |
          pub const fn arg_fn() -> typeref { return {{global.expr_value}}; }
          pub const fn fn_(param: typeref) -> typeref { return param; }
        exclude_if_source_only_before_expr: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_const: ""
        exclude_if_requires_fn_with_param: ""
      unary_custom_neg:
        form: "-123u"
        source: "pub const fn __neg__(_param: u32) -> typeref { return {{global.expr_value}}; }"
        exclude_if_source_only_before_expr: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_const: ""
        exclude_if_requires_fn_with_param: ""
      unary_custom_not:
        form: "!123u"
        source: "pub const fn __not__(_param: u32) -> typeref { return {{global.expr_value}}; }"
        exclude_if_source_only_before_expr: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_not_const: ""
        exclude_if_requires_fn_with_param: ""
      fn_param:
        form: "param"
        source: ""
        exclude_if_source_only_before_expr: "<EXCLUDE>"
        exclude_if_not_ref: ""
        exclude_if_not_const: ""
        exclude_if_requires_fn_with_param: "<EXCLUDE>"

  - id: global
    cases:
      default:
        default_value: "bool"
        expr_value: "i32"
        value_from_expr_as_type: "123"
