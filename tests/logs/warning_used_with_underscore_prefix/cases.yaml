# Test incorrect case for used item with leading underscore.

dimensions:
  - id: item
    cases:
      const_global:
        code: "const _CONSTANT = 0;"
        ref: "_CONSTANT"
      var_global:
        code: "var _var = 0;"
        ref: "_var"
      fn:
        code: "fn _fn() -> i32 { return 0; }"
        ref: "_fn()"
      fn_param:
        code: "fn _fn(_param: i32) -> i32 { return _param; }"
        ref: "0"
