# Test incorrect case for item naming.

dimensions:
  - id: item
    cases:
      const_global:
        code: "const _CONSTANT = 0;"
        ref: "_CONSTANT"
      var_global:
        code: "var _var = 0;"
        ref: "_var"
      fn:
        code: "fn _fn() -> i32 { return 0; }"
        ref: "_fn()"
