# Test expressions that are not valid references.

dimensions:
  - id: expr_location
    cases:
      statement_assignment_left:
        # call the function in another function signature to increase test coverage
        code: |
          const fn called_fn() -> typeref {
              {{expr.form}} = {{expr.form}};
              return i32;
          }
          fn _fn() -> called_fn() {
              return 1;
          }

  - id: expr
    cases:
      literal_bool_false:
        form: "false"
        source: ""
      literal_bool_true:
        form: "true"
        source: ""
      literal_f32:
        form: "0.0"
        source: ""
      literal_i32:
        form: "0"
        source: ""
      literal_u32:
        form: "0u"
        source: ""
      type_native:
        form: "i32"
        source: ""
      const_global:
        form: "CONST"
        source: "const CONST = 123;"
      fn_call:
        form: "fn_()"
        source: "const fn fn_() -> i32 { return 0; }"
      unary_neg:
        form: "-true"
        source: "const fn __neg__(param: bool) -> bool { return param; }"
      unary_not:
        form: "!true"
        source: "const fn __not__(param: bool) -> bool { return param; }"
