# Test usage of non-const expressions in const contexts.

dimensions:
  - id: const_expr_location
    cases:
      const_global:
        exclusions: |
          {{non_const_item.exclude_if_requires_fn_with_param_typeref}}
        code: "const _RESULT = {{non_const_item.ref}};"
        expr_span_start: "2:17"
        const_mark_span_start: "2:1"
      statement_assignment_left:
        exclusions: |
          {{non_const_item.exclude_if_not_ref}}
          {{non_const_item.exclude_if_requires_fn_with_param_typeref}}
        code: "const fn _result() { {{non_const_item.ref}} = 123; }"
        expr_span_start: "2:22"
        const_mark_span_start: "2:1"
      statement_assignment_right:
        exclusions: |
          {{non_const_item.exclude_if_requires_fn_with_param_typeref}}
        code: "const fn _result(param: i32) { param = {{non_const_item.ref}}; }"
        expr_span_start: "2:40"
        const_mark_span_start: "2:1"
      statement_return:
        exclusions: |
          {{non_const_item.exclude_if_requires_fn_with_param_typeref}}
        code: "const fn _result() -> i32 { return {{non_const_item.ref}}; }"
        expr_span_start: "2:36"
        const_mark_span_start: "2:1"
      call_arg:
        exclusions: |
          {{non_const_item.exclude_if_requires_fn_with_param_typeref}}
        code: "const _RESULT = fn_({{non_const_item.ref}});"
        expr_span_start: "2:21"
        const_mark_span_start: "2:1"
      unary_operand_neg:
        exclusions: |
          {{non_const_item.exclude_if_requires_fn_with_param_typeref}}
        code: "const _RESULT = -{{non_const_item.ref}};"
        expr_span_start: "2:18"
        const_mark_span_start: "2:1"
      unary_operand_not:
        exclusions: |
          {{non_const_item.exclude_if_requires_fn_with_param_typeref}}
        code: "const _RESULT = !{{non_const_item.ref}};"
        expr_span_start: "2:18"
        const_mark_span_start: "2:1"
      fn_param_type:
        exclusions: |
          {{non_const_item.exclude_if_requires_fn_with_param_typeref}}
        code: "fn _result(_param: {{non_const_item.ref}}) -> i32 { return 123; }"
        expr_span_start: "2:20"
        const_mark_span_start: "2:18"
      fn_return_type:
        exclusions: |
          {{non_const_item.exclude_if_requires_fn_with_param_typeref}}
        code: "fn _result() -> {{non_const_item.ref}} { return 123; }"
        expr_span_start: "2:17"
        const_mark_span_start: "2:14"
      fn_param_type_typeref_param:
        exclusions: ""
        code: |
          const fn fn_(
              {{non_const_item.underscore_if_param_typeref_unused}}param_typeref: typeref,
              _param_other: {{non_const_item.ref}},
          ) -> i32 {
              return 123;
          }
        expr_span_start: "4:19"
        const_mark_span_start: "4:17"
      fn_return_type_with_typeref_param:
        exclusions: ""
        code: |
          const fn fn_(
              {{non_const_item.underscore_if_param_typeref_unused}}param_typeref: typeref,
              _param_other: i32,
          ) -> {{non_const_item.ref}} {
              return 123;
          }
        expr_span_start: "5:6"
        const_mark_span_start: "5:3"

  - id: non_const_item
    cases:
      var_global:
        code: "var var_ = 123;"
        ref: "var_"
        exclude_if_not_ref: ""
        underscore_if_param_typeref_unused: "_"
        exclude_if_requires_fn_with_param_typeref: ""
      fn:
        code: "fn fn_() -> i32 { return 123; }"
        ref: "fn_()"
        exclude_if_not_ref: "<EXCLUDE>"
        underscore_if_param_typeref_unused: "_"
        exclude_if_requires_fn_with_param_typeref: ""
      fn_unary_neg:
        code: "fn __neg__(param: i32) -> i32 { return param; }"
        ref: "- 123"
        exclude_if_not_ref: "<EXCLUDE>"
        underscore_if_param_typeref_unused: "_"
        exclude_if_requires_fn_with_param_typeref: ""
      fn_unary_not:
        code: "fn __not__(param: i32) -> i32 { return param; }"
        ref: "!123"
        exclude_if_not_ref: "<EXCLUDE>"
        underscore_if_param_typeref_unused: "_"
        exclude_if_requires_fn_with_param_typeref: ""
      param:
        code: ""
        ref: "param_typeref"
        underscore_if_param_typeref_unused: ""
        exclude_if_not_ref: ""
        exclude_if_requires_fn_with_param_typeref: "<EXCLUDE>"
