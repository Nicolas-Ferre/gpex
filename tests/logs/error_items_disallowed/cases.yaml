# Test disallowed items.

dimensions:
  - id: item
    cases:
      compilerimpl_struct:
        code: "struct MyType = compilerimpl {}"
      repeat_with_returned_type:
        code: |
          fn fn_() -> i32 {
              return 0;
          }
          repeat fn_();
      statement_return_without_return_type:
        code: |
          fn fn_() {
              return 0;
          }
      statement_return_duplicated:
        code: |
          fn fn_() -> i32 {
              return 0;
              return 1;
          }
