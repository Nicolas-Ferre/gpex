# Test not found expression sources while the item is defined in the same file after.

dimensions:
  - id: expr_location
    cases:
      const_global:
        exclusions: "{{expr.exclude_if_requires_fn_with_param}}"
        code: "const _RESULT = {{expr.form}};"
      var_global:
        exclusions: "{{expr.exclude_if_requires_fn_with_param}}"
        code: "var _result = {{expr.form}};"
      statement_assignment_left:
        exclusions: "{{expr.exclude_if_requires_fn_with_param}}"
        code: |
          fn _fn() {
              {{expr.form}} = 123;
          }
      statement_assignment_right:
        exclusions: "{{expr.exclude_if_requires_fn_with_param}}"
        code: |
          var result = 0;
          fn _fn() {
              result = {{expr.form}};
          }
      statement_return:
        exclusions: "{{expr.exclude_if_requires_fn_with_param}}"
        code: |
          fn _fn() -> i32 {
              return {{expr.form}};
          }
      repeat_fn_arg:
        exclusions: "{{expr.exclude_if_requires_fn_with_param}}"
        code: "repeat fn_({{expr.form}});"
        code_unique_name: "repeat fn_({{expr.form_unique_name}});"
      fn_param_type:
        exclusions: ""
        code: |
          fn _fn(_param: {{expr.form}}) -> i32 {
              return 123;
          }
      fn_with_param_after_param_type:
        exclusions: ""
        code: |
          fn _fn(_before_param: {{expr.form}}, _param: typeref) -> i32 {
              return 123;
          }
      fn_return_type:
        exclusions: "{{expr.exclude_if_requires_fn_with_param}}"
        # function is `const` to increase test coverage
        code: |
          const fn fn_(_param: i32) -> {{expr.form}} {
              return 123;
          }
          const _USAGE = fn_(0);

  - id: expr
    cases:
      const_global:
        form: "_CONST"
        source: "const _CONST = 0;"
        exclude_if_requires_fn_with_param: ""
      var_global:
        form: "_var"
        source: "var _var = 0;"
        exclude_if_requires_fn_with_param: ""
      fn_call_with_mismatching_param_count:
        form: "_called_fn()"
        source: "fn _called_fn(param: i32) -> i32 { return param; }"
        exclude_if_requires_fn_with_param: ""
      fn_call_with_mismatching_param_type:
        form: "_called_fn(123u)"
        source: "fn _called_fn(param: i32) -> i32 { return param; }"
        exclude_if_requires_fn_with_param: ""
      fn_call_with_unknown_arg_type:
        form: "called(unknown_return_type())"
        source: "const fn unknown_return_type() -> unknown { return 0; }"
        exclude_if_requires_fn_with_param: ""
      fn_param:
        form: "_param"
        source: ""
        exclude_if_requires_fn_with_param: "<EXCLUDE>"
      fn_param_external:
        form: "other_param"
        source: "fn _other_fn(other_param: i32) -> i32 { return other_param; }"
        exclude_if_requires_fn_with_param: ""
