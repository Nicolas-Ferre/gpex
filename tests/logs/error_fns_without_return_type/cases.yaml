# Test functions without return type called as expression.

dimensions:
  - id: fn_call_location
    cases:
      var_global:
        code: "var _result = fn_();"
        error_span_start: "6:15"
      const_global:
        code: "const _RESULT = fn_();"
        error_span_start: "6:17"
      statement_assignment_right:
        code: "fn _result() { value = fn_(); }"
        error_span_start: "6:24"
      statement_return:
        code: "fn _result() -> i32 { return fn_(); }"
        error_span_start: "6:30"
      repeat_fn_arg:
        code: "repeat fn_(fn_());"
        error_span_start: "6:12"
      unary_operand_neg:
        code: "var _result = -fn_();"
        error_span_start: "6:16"
      unary_operand_not:
        code: "var _result = !fn_();"
        error_span_start: "6:16"
      fn_param_type:
        code: "fn _result(_param: fn_()) -> i32 { return 123; }"
        error_span_start: "6:20"
      fn_return_type:
        code: "fn _result() -> fn_() { return 123; }"
        error_span_start: "6:17"
      # statement_assignment_left is not tested because it is irrelevant for this test.
