# Test circular expression with all expression locations.

dimensions:
  - id: cycle_location1
    cases:
      const_global:
        exclusions: "{{cycle_location1_ref.exclude_if_not_const}}"
        item1: "pub const CONST1 = {{cycle_location2.item3_ref}};"
        item2: "pub const CONST2 = {{cycle_location2.item4_ref}};"
        item1_span_start: "3:11"
        ref3_span_start: "3:20"
        ref4_span_start: "4:20"
      var_global:
        exclusions: "{{cycle_location1_ref.exclude_if_not_var}}"
        item1: "pub var var1 = {{cycle_location2.item3_ref}};"
        item2: "pub var var2 = {{cycle_location2.item4_ref}};"
        item1_span_start: "3:9"
        ref3_span_start: "3:16"
        ref4_span_start: "4:16"
      statement_assignment_left:
        exclusions: "{{cycle_location1_ref.exclude_if_not_fn_without_arg}}"
        item1: "pub fn fn1() -> i32 { {{cycle_location2.item3_ref}} = 0; return true; }"
        item2: "pub fn fn2() -> i32 { {{cycle_location2.item4_ref}} = 0; return true; }"
        item1_span_start: "3:8"
        ref3_span_start: "3:23"
        ref4_span_start: "4:23"
      statement_assignment_right:
        exclusions: "{{cycle_location1_ref.exclude_if_not_fn_without_arg}}"
        item1: "pub fn fn1() -> i32 { var_ = {{cycle_location2.item3_ref}}; return true; }"
        item2: "pub fn fn2() -> i32 { var_ = {{cycle_location2.item4_ref}}; return 0; }"
        item1_span_start: "3:8"
        ref3_span_start: "3:30"
        ref4_span_start: "4:30"
      statement_return:
        exclusions: "{{cycle_location1_ref.exclude_if_not_fn_without_arg}}"
        item1: "pub fn fn1() -> i32 { return {{cycle_location2.item3_ref}}; }"
        item2: "pub fn fn2() -> i32 { return {{cycle_location2.item4_ref}}; }"
        item1_span_start: "3:8"
        ref3_span_start: "3:30"
        ref4_span_start: "4:30"
      call_arg:
        exclusions: "{{cycle_location1_ref.exclude_if_not_var}}"
        item1: "pub var var1 = called({{cycle_location2.item3_ref}});"
        item2: "pub var var2 = called({{cycle_location2.item4_ref}});"
        item1_span_start: "3:9"
        ref3_span_start: "3:23"
        ref4_span_start: "4:23"
      unary_neg:
        exclusions: "{{cycle_location1_ref.exclude_if_not_var}}"
        item1: "pub var var1 = -{{cycle_location2.item3_ref}};"
        item2: "pub var var2 = -{{cycle_location2.item4_ref}};"
        item1_span_start: "3:9"
        ref3_span_start: "3:17"
        ref4_span_start: "4:17"
      unary_not:
        exclusions: "{{cycle_location1_ref.exclude_if_not_var}}"
        item1: "pub var var1 = !{{cycle_location2.item3_ref}};"
        item2: "pub var var2 = !{{cycle_location2.item4_ref}};"
        item1_span_start: "3:9"
        ref3_span_start: "3:17"
        ref4_span_start: "4:17"
      fn_param_type:
        exclusions: "{{cycle_location1_ref.exclude_if_not_fn_with_arg}}"
        item1: "pub fn fn1(_param: {{cycle_location2.item3_ref}}) -> i32 { return 0; }"
        item2: "pub fn fn2(_param: {{cycle_location2.item4_ref}}) -> i32 { return 0; }"
        item1_span_start: "3:8"
        ref3_span_start: "3:20"
        ref4_span_start: "4:20"
      fn_return_type:
        exclusions: "{{cycle_location1_ref.exclude_if_not_fn_without_arg}}"
        item1: "pub fn fn1() -> {{cycle_location2.item3_ref}} { return 0; }"
        item2: "pub fn fn2() -> {{cycle_location2.item4_ref}} { return 0; }"
        item1_span_start: "3:8"
        ref3_span_start: "3:17"
        ref4_span_start: "4:17"
      # repeat_fn_arg case is not defined as it never creates circular dependencies.

  - id: cycle_location2
