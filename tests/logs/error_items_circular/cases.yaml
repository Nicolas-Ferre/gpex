      # repeat_fn_arg case is not defined as it never creates circular dependencies.

  - id: cycle_location1_ref
    cases:
      const:
        item1: "CONST1"
        item2: "CONST2"
        item1_name: "CONST1"
        exclude_if_not_const: ""
        exclude_if_not_var: "<EXCLUDE>"
        exclude_if_not_fn_without_arg: "<EXCLUDE>"
