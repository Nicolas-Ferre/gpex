# Test items with conflicting names.

dimensions:
  - id: item1
    cases:
      const_global:
        code: "const _item = 0;"
      var_global:
        code: "var _item = 0;"
      fn_params:
        code: "fn _fn(_item: i32, _other: u32, _item: f32) {}"

  - id: item2
    cases:
      const_global:
        code: "const _item = 1;"
      var_global:
        code: "var _item = 1;"
