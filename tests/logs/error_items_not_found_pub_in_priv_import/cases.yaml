# Test not found expression sources while the item is public but imported via a intermediate private import.

dimensions:
  - id: expr_location
    cases:
      const_global:
        code: "const _RESULT = {{expr.form}};"
      var_global:
        code: "var _result = {{expr.form}};"
      statement_assignment_left:
        code: |
          fn _fn() {
              {{expr.form}} = 123;
          }
      statement_assignment_right:
        code: |
          var result = 0;
          fn _fn() {
              result = {{expr.form}};
          }
      statement_return:
        code: |
          fn _fn() -> i32 {
              return {{expr.form}};
          }
      repeat_fn_arg:
        code: "repeat fn_({{expr.form}});"
      unary_neg:
        code: "var _result = -{{expr.form}};"
      unary_not:
        code: "var _result = !{{expr.form}};"
      fn_param_type:
        code: |
          fn _fn(_param: {{expr.form}}) -> i32 {
              return 123;
          }
      fn_return_type:
        code: |
          fn _fn() -> {{expr.form}} {
              return 123;
          }

  - id: expr
    cases:
      const_global:
        form: "CONST"
        source: "const CONST = 0;"
      var_global:
        form: "var_"
        source: "var var_ = 0;"
      fn_call:
        form: "called_fn()"
        source: "fn called_fn() -> i32 { return 0; }"
      unary_neg:
        form: "-true"
        source: "fn __neg__(param: bool) -> bool { return param; }"
      unary_not:
        form: "!true"
        source: "fn __not__(param: bool) -> bool { return param; }"
