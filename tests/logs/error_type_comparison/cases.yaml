# Test mismatching expression types.

dimensions:
  - id: expr_location
    cases:
      statement_assignment_left:
        exclusions: |
          {{expr.exclude_if_not_ref}}
        code: |
          var result = {{expr.other_type_default}};
          fn _fn({{expr.params}}) {
              {{expr.form}} 
                  = result;
          }
        actual_type: "{{expr.other_type}}"
        info: "expected `{{expr.type}}` type (at <root>/main__$$.gpex:4:5)"
        actual_span_start: "5:11"
      statement_assignment_right:
        exclusions: ""
        code: |
          var result = {{expr.other_type_default}};
          fn _fn({{expr.params}}) {
              result = {{expr.form}};
          }
        actual_type: "{{expr.type}}"
        info: "expected `{{expr.other_type}}` type (at <root>/main__$$.gpex:4:5)"
        actual_span_start: "4:14"
      statement_return:
        exclusions: ""
        code: |
          fn _fn(
              {{expr.params}}
          ) -> {{expr.other_type}} { 
              return {{expr.form}};
          }
        actual_type: "{{expr.type}}"
        info: "expected `{{expr.other_type}}` type (at <root>/main__$$.gpex:4:6)"
        actual_span_start: "5:12"
      fn_param_type:
        exclusions: |
          {{expr.exclude_if_valid_type}}
          {{expr.exclude_if_not_valid_in_fn_signature}}
        code: |
          fn _fn(_param: {{expr.form}}) -> i32 {
              return 123;
          }
        actual_type: "{{expr.type}}"
        info: "expected `typeref` type"
        actual_span_start: "2:16"
      fn_return_type:
        exclusions: |
          {{expr.exclude_if_valid_type}}
          {{expr.exclude_if_not_valid_in_fn_signature}}
        code: |
          fn _fn() -> {{expr.form}} {
              return 123;
          }
        actual_type: "{{expr.type}}"
        info: "expected `typeref` type"
        actual_span_start: "2:13"

  - id: expr
    cases:
      literal_bool_true:
        form: "true"
        source: ""
        type: "bool"
        other_type: "u32"
        other_type_default: "0u"
        params: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_valid_type: ""
        exclude_if_not_valid_in_fn_signature: ""
      literal_bool_false:
        form: "false"
        source: ""
        type: "bool"
        other_type: "u32"
        other_type_default: "0u"
        params: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_valid_type: ""
        exclude_if_not_valid_in_fn_signature: ""
      literal_f32:
        form: "1.23"
        source: ""
        type: "f32"
        other_type: "u32"
        other_type_default: "0u"
        params: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_valid_type: ""
        exclude_if_not_valid_in_fn_signature: ""
      literal_i32:
        form: "123"
        source: ""
        type: "i32"
        other_type: "u32"
        other_type_default: "0u"
        params: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_valid_type: ""
        exclude_if_not_valid_in_fn_signature: ""
      literal_u32:
        form: "123u"
        source: ""
        type: "u32"
        other_type: "i32"
        other_type_default: "0"
        params: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_valid_type: ""
        exclude_if_not_valid_in_fn_signature: ""
      type_native:
        form: "i32"
        source: ""
        type: "typeref"
        other_type: "u32"
        other_type_default: "0u"
        params: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_valid_type: "<EXCLUDE>"
        exclude_if_not_valid_in_fn_signature: ""
      const_global:
        form: "ITEM"
        source: "const ITEM = 0;"
        type: "i32"
        other_type: "u32"
        other_type_default: "0u"
        params: ""
        exclude_if_not_ref: "<EXCLUDE>"
        exclude_if_valid_type: ""
        exclude_if_not_valid_in_fn_signature: ""
      var_global:
        form: "item"
        source: "var item = 0;"
        type: "i32"
        other_type: "u32"
        other_type_default: "0u"
        params: ""
        exclude_if_not_ref: ""
        exclude_if_valid_type: ""
        exclude_if_not_valid_in_fn_signature: "<EXCLUDE>"
      fn_param:
        form: "param"
        source: ""
        type: "i32"
        other_type: "u32"
        other_type_default: "0u"
        params: "param: i32"
        exclude_if_not_ref: ""
        exclude_if_valid_type: ""
        exclude_if_not_valid_in_fn_signature: "<EXCLUDE>"
      fn_call_no_arg:
        form: "called_fn()"
        source: "const fn called_fn() -> i32 { return 0; }"
        type: "i32"
        other_type: "u32"
        other_type_default: "0u"
        params: ""
