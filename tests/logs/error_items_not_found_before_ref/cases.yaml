# Test not found expression sources while the item is defined in the same file before.

dimensions:
  - id: expr_location
    cases:
      const_global:
        exclusions: ""
        code: "const _RESULT = {{expr.form}};"
        expr_span_start: "2:17"
      var_global:
        exclusions: ""
        code: "var _result = {{expr.form}};"
        expr_span_start: "2:15"
      statement_assignment_left:
        exclusions: |
          {{expr.exclude_if_not_ref}}
        code: |
          fn _fn() {
              {{expr.form}} = 123;
          }
        expr_span_start: "3:5"
      statement_assignment_right:
        exclusions: ""
        code: |
          var result = 0;
          fn _fn() {
              result = {{expr.form}};
          }
        expr_span_start: "4:14"
      statement_return:
        exclusions: ""
        code: |
          fn _fn() -> i32 {
              return {{expr.form}};
          }
        expr_span_start: "3:12"
      repeat_fn_arg:
        exclusions: ""
        code: "repeat fn_({{expr.form}});"
        expr_span_start: "2:12"
      fn_param_type:
        exclusions: ""
        code: |
          fn _fn(_param: {{expr.form}}) -> i32 {
              return 123;
          }
        expr_span_start: "2:16"
      fn_return_type:
        exclusions: ""
        # function is `const` to increase test coverage
        code: |
          const fn fn_(_param: i32) -> {{expr.form}} {
              return 123;
          }
          const _USAGE = fn_(0);
        expr_span_start: "2:30"

  - id: expr
    cases:
      fn_call_with_mismatching_param_count:
        form: "_called_fn()"
        source: "fn _called_fn(param: i32) -> i32 { return param; }"
        item_name: "_called_fn()"
        exclude_if_not_ref: "<EXCLUDE>"
      fn_call_with_mismatching_param_type:
        form: "_called_fn(123u)"
        source: "fn _called_fn(param: i32) -> i32 { return param; }"
        item_name: "_called_fn(u32)"
        exclude_if_not_ref: "<EXCLUDE>"
      fn_param_external:
        form: "other_param"
        source: "fn _other_fn(other_param: i32) -> i32 { return other_param; }"
        item_name: "other_param"
        exclude_if_not_ref: ""
