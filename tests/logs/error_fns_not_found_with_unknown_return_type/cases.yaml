# Test not found expression sources while the item is defined in the same file after.

dimensions:
  - id: expr_location
    cases:
      const_global:
        code: "const _RESULT = {{expr.form}};"
        after_expr_line: "2"
      var_global:
        code: "var _result = {{expr.form}};"
        after_expr_line: "2"
      statement_assignment_right:
        code: |
          var result = 0;
          fn _fn() {
              result = {{expr.form}};
          }
        after_expr_line: "6"
      statement_return:
        code: |
          fn _fn() -> i32 {
              return {{expr.form}};
          }
        after_expr_line: "5"
      repeat_fn_arg:
        code: "repeat fn_({{expr.form}});"
        after_expr_line: "2"
      fn_param_type:
        code: |
          fn _fn(_param: {{expr.form}}) -> i32 {
              return 123;
          }
        after_expr_line: "5"
      fn_with_param_after_param_type:
        code: |
          fn _fn(_before_param: {{expr.form}}, _param: typeref) -> i32 {
              return 123;
          }
        after_expr_line: "5"
      fn_return_type:
        # function is `const` to increase test coverage
        code: |
          const fn fn_(_param: i32) -> {{expr.form}} {
              return 123;
          }
          const _USAGE = fn_(0);
        after_expr_line: "6"
      # statement_assignment_left is not tested because expressions are not references

  - id: expr
    cases:
      fn_call_with_unknown_arg_type:
        form: "called(unknown_return_type())"
        source: "const fn unknown_return_type() -> unknown { return 0; }"
